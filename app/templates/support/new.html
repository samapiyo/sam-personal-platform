{% extends "base.html" %}

{% block title %}Create Support Ticket{% endblock %}

{% block content %}
<section class="page">

    <p class="eyebrow">SUPPORT</p>

    <h1>Create a Support Ticket</h1>

    <p>
        Tell us what you need help with. Please provide as much detail
        as possible.
    </p>

    <div class="admin-panel">

        <form method="post">

            <div class="form-group">
                <label for="subject">Subject</label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="What do you need help with?"
                    maxlength="200"
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="8"
                    placeholder="Describe your issue..."
                    required
                ></textarea>
            </div>

            <div class="form-actions">

                <button class="button" type="submit">
                    Submit Ticket
                </button>

                <a
                    class="button secondary"
                    href="{{ url_for('main.support') }}"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>
{% endblock %}
