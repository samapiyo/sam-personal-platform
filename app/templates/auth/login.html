{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<section class="form-page">

    <form method="post" class="form-card">

        <h1>Login</h1>

        <label>
            Email

            <input
                name="email"
                type="email"
                required
            >
        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                required
            >
        </label>


        <div
            style="
                text-align: right;
                margin-top: -8px;
                margin-bottom: 16px;
            "
        >

            <a href="{{ url_for('auth.forgot_password') }}">
                Forgot Password?
            </a>

        </div>


        <button
            class="button"
            type="submit"
        >
            Login
        </button>


        <p>
            New here?

            <a href="{{ url_for('auth.register') }}">
                Create an account
            </a>
        </p>

    </form>

</section>

{% endblock %}
