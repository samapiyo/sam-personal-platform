{% extends "base.html" %}

{% block title %}Edit Product{% endblock %}

{% block content %}

<section class="page">

    <div class="page-header">

        <div>
            <p class="eyebrow">ADMIN PRODUCTS</p>

            <h1>Edit Product</h1>

            <p>
                Update the product information below.
            </p>
        </div>

        <a
            class="button secondary"
            href="{{ url_for('admin.products') }}"
        >
            &larr; Back to Products
        </a>

    </div>


    <div class="admin-panel">

        <form
            method="post"
            action="{{ url_for('admin.edit_product', product_id=product.id) }}"
        >

            <div class="form-group">

                <label for="name">
                    Product Name
                </label>

                <input
                    id="name"
                    type="text"
                    name="name"
                    value="{{ product.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <input
                    id="category"
                    type="text"
                    name="category"
                    value="{{ product.category }}"
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="7"
                >{{ product.description }}</textarea>

            </div>


            <div class="form-group">

                <label for="price">
                    Price
                </label>

                <input
                    id="price"
                    type="number"
                    name="price"
                    min="0"
                    step="0.01"
                    value="{{ product.price }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="stock">
                    Stock
                </label>

                <input
                    id="stock"
                    type="number"
                    name="stock"
                    min="0"
                    value="{{ product.stock }}"
                    required
                >

            </div>


            <div style="display:flex; gap:12px; flex-wrap:wrap;">

                <button
                    class="button"
                    type="submit"
                >
                    Save Changes
                </button>

                <a
                    class="button secondary"
                    href="{{ url_for('admin.products') }}"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
